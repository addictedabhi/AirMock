# nginx site for the AirMock website: HTTPS, security headers and caching.
# Copy to /etc/nginx/sites-available/airmock-site, then:
#   sudo ln -sf /etc/nginx/sites-available/airmock-site /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace airmock.example.internal and the certificate paths. For an internal CA, see README.md.

server {
    listen 80;
    server_name airmock.example.internal;
    # Plain HTTP only redirects, so the copy button, clipboard and every other
    # secure-context feature work for visitors.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name airmock.example.internal;

    ssl_certificate     /etc/ssl/airmock/site.crt;   # include the chain if your CA has intermediates
    ssl_certificate_key /etc/ssl/airmock/site.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /var/www/airmock-site;
    index index.html;

    # Security headers. The page loads everything from its own origin (fonts
    # included); it needs 'unsafe-inline' only for its own inline script and styles.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # The page, the favicon and the download list change when you republish: always revalidate.
    location = /            { add_header Cache-Control "no-cache" always; try_files /index.html =404; }
    location = /index.html  { add_header Cache-Control "no-cache" always; }
    location = /favicon.svg { add_header Cache-Control "no-cache" always; }
    location = /downloads/manifest.json  { add_header Cache-Control "no-cache" always; }
    location = /downloads/checksums.txt  { add_header Cache-Control "no-cache" always; }

    # Fonts and images rarely change; a month is plenty.
    location ~* \.(woff2|webp|png)$ {
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Packages: cached briefly, served as downloads.
    location /downloads/ {
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
        types { application/gzip tar.gz; application/zip zip; application/vnd.debian.binary-package deb; application/x-rpm rpm; }
        default_type application/octet-stream;
    }

    location / { try_files $uri $uri/ =404; }
}
