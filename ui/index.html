<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AirMock</title>
    <!-- Applies the saved theme, its light/dark mode and its accent before first
         paint, so a reload does not flash the default theme. The modes object below
         is filled in at build time with { themeId: mode } read from
         src/lib/theme.js (see vite.config.js), so every theme is covered. Keep
         the legacy-value migration and attribute names in sync with theme.js's
         initial() and applyThemeAndAccent(). -->
    <script>
      (function () {
        try {
          var modes = __THEME_MODES__;
          var t = localStorage.getItem('airmock-theme');
          if (t === 'dark') t = 'midnight';
          else if (t === 'light') t = 'daylight';
          if (!modes[t]) return;
          var root = document.documentElement;
          root.dataset.theme = t;
          root.dataset.themeMode = modes[t];
          var accents = JSON.parse(localStorage.getItem('airmock-accents') || '{}');
          if (accents && accents[t]) root.dataset.accent = accents[t];
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
